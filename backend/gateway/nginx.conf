# Gateway NobarIlmu: satu pintu masuk untuk REST (/api) dan WebSocket (/ws).
# Cloudflare Tunnel meneruskan https://kelompokFarizRiko.stei.site -> http://gateway:80

# Batas pemanggilan per IP asli pengguna (Cloudflare mengirim IP di CF-Connecting-IP).
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}
limit_req_zone  $client_ip zone=api:10m rate=10r/s;
limit_conn_zone $client_ip zone=ws:10m;

upstream core {
  server core-service:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 32k;

  location = / {
    return 302 /api/docs/;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://core;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
  }

  location /ws/ {
    limit_conn ws 10;
    proxy_pass http://core;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    return 404 '{"error":{"code":"NOT_FOUND","message":"Pakai /api"}}';
    default_type application/json;
  }
}
