# NobarIlmu: microservice di STB kelompok (K02)
# Jalankan:  docker compose up -d --build
# Publik:    https://nobarilmu.stei.site/api  (lewat Cloudflare Tunnel, tanpa membuka port)
services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    env_file: .env # rahasia, jangan di-commit
    environment:
      DB_PATH: /app/data/nobarilmu.db
      PORT: "3000"
    volumes:
      - nobarilmu-data:/app/data # file SQLite (backup: lihat README)
    mem_limit: 256m # jaga STB tidak hang
    cpus: 0.5
    logging: &logging
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80" # hanya untuk tes lokal di STB, tidak dibuka ke internet
    depends_on:
      core-service:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on: [gateway]
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

volumes:
  nobarilmu-data:
